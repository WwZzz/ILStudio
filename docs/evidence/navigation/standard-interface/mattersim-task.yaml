name: r2r
datasets:
- name: r2r
  type: vlastudio.data_utils.datasets.R2RDataset
  args:
    max_trajectories: 1
    download: true
    connectivity_path: ${NAVIGATION_ROOT}/mattersim-install-check/source/connectivity
    dataset_dir: ${NAVIGATION_ROOT}/mp3d-native
meta:
  action_dim: 1
  state_dim: 3
  chunk_size: 1
  action_normalize: identity
  state_normalize: identity
