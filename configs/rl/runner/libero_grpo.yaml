version: 1
name: libero_grpo
metadata:
  description: Outcome-reward online RL loop for LIBERO token policies
type: rl.runtime.RLRunner
config_type: rl.runtime.RLRunnerConfig
args:
  iterations: 1
  collect_episodes: 8
  batch_size: 8
  deterministic_collection: false
  clear_rollout_after_update: true
collector:
  args:
    terminate_on_success: true
    bootstrap_on_truncation: true
    max_episode_steps: 512
