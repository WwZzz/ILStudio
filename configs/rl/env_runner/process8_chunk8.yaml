version: 1
name: process8_chunk8
metadata:
  description: Eight spawned environments with batched chunk-8 policy inference
runner:
  type: benchmark.env_runner.ProcessEnvRunner
  args:
    num_envs: 8
    start_method: spawn
    seed: 0
    # GRPO replicas share the same task initialization within one group.
    seed_stride: 0
executor:
  type: rl.executor.BatchedRLPolicyExecutor
  args:
    num_envs: 8
    execution_horizon: 8
collector:
  type: rl.collector.ParallelCollector
  args: {}
