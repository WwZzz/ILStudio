version: 1
name: process8
metadata:
  description: Eight spawned LIBERO environments with batched policy inference
runner:
  type: benchmark.env_runner.ProcessEnvRunner
  args:
    num_envs: 8
    start_method: spawn
    seed_stride: 1
executor:
  type: rl.executor.BatchedRLPolicyExecutor
  args:
    num_envs: 8
    execution_horizon: 1
collector:
  type: rl.collector.ParallelCollector
  args: {}
