version: 1
type: rl.algorithm.PPOAlgorithm
critic: state_value
args:
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  reward_key: train/total
  value_coef: 0.5
  entropy_coef: 0.01
  normalize_advantage: true
  decision_discount_mode: env_step
policy_adapter:
  fallback_adapter: base
  required_capabilities: [action, evaluate_actions]
  args:
    action_adapter:
      type: rl.policy_adapter.action.GaussianActionAdapter
      args:
        initial_std: 0.2
        learn_std: true
buffer:
  type: rl.buffer.RolloutBuffer
  args: {}
runner:
  collect_episodes: 1
  updates_per_iteration: 4
  warmup_steps: 0
