version: 1
type: rl.algorithm.IQLAlgorithm
critic: policy_feature_chunk_qv
args:
  gamma: 0.99
  reward_key: train/total
  expectile: 0.7
  advantage_temperature: 3.0
  max_advantage_weight: 100.0
  actor_loss: mse
  target_tau: 0.005
  actor_learning_rate: 0.000001
  critic_learning_rate: 0.001
  value_learning_rate: 0.001
policy_adapter:
  required_capabilities: [action, sample_actions, batch_actions]
  args:
    action_adapter:
      type: policy.act.rl_adapter.ACTActionAdapter
      args:
        exploration_std: 0.0
        action_clip: [-1.0, 1.0]
        feature_spatial_grid: [4, 4]
        feature_timestep_scale: 128.0
        seed: 0
buffer:
  type: rl.buffer.DecisionReplayBuffer
  args:
    capacity: 100000
    seed: 0
runner:
  updates_per_iteration: 10
  warmup_steps: 1
