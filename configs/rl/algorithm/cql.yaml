version: 1
type: rl.algorithm.CQLAlgorithm
critic: state_action_twin
args:
  gamma: 0.99
  reward_key: train/total
  alpha: auto
  target_entropy: -1.0
  target_tau: 0.005
  conservative_weight: 1.0
  conservative_temperature: 1.0
  num_action_samples: 10
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  alpha_learning_rate: 0.0003
policy_adapter:
  fallback_adapter: base
  required_capabilities: [action, sample_actions, batch_actions, uniform_actions]
  args:
    action_adapter:
      type: rl.policy_adapter.action.GaussianActionAdapter
      args:
        initial_std: 0.2
        learn_std: true
buffer:
  type: rl.buffer.ReplayBuffer
  args:
    capacity: 100000
    seed: 0
runner:
  updates_per_iteration: 100
  warmup_steps: 1
