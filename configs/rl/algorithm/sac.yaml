version: 1
type: rl.algorithm.SACAlgorithm
args:
  gamma: 0.99
  reward_key: train/total
  alpha: auto
  target_entropy: -1.0
  target_tau: 0.01
policy_adapter:
  required_capabilities: [action, sac, target_update, temperature]
  args:
    policy_std: 0.2
    critic_activation: relu
    actor_learning_rate: 0.0005
    critic_learning_rate: 0.001
    alpha_learning_rate: 0.001
    seed: 0
buffer:
  type: rl.buffer.ReplayBuffer
  args:
    capacity: 100000
    seed: 0
runner:
  collect_episodes: 1
  updates_per_iteration: 20
  warmup_steps: 1000
