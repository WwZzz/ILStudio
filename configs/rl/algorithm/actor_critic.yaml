version: 1
metadata:
  recommended_reward: raw_0_01
  recommended_training_overrides:
    learning_rate: 0.0002
type: rl.algorithm.ActorCriticAlgorithm
critic: state_value
args:
  gamma: 0.98
  reward_key: train/total
  value_coef: 1.0
  entropy_coef: 0.0
policy_adapter:
  fallback_adapter: base
  required_capabilities: [action, evaluate_actions]
  args:
    action_adapter:
      type: rl.policy_adapter.action.GaussianActionAdapter
      args:
        initial_std: 0.2
        learn_std: true
buffer:
  type: rl.buffer.RolloutBuffer
  args: {}
runner:
  collect_steps: 10
  updates_per_iteration: 1
  warmup_steps: 0
