version: 1
type: rl.algorithm.IQLAlgorithm
critic: state_action_qv
args:
  gamma: 0.99
  reward_key: train/total
  expectile: 0.7
  advantage_temperature: 3.0
  max_advantage_weight: 100.0
  actor_loss: log_prob
  target_tau: 0.005
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  value_learning_rate: 0.0003
policy_adapter:
  fallback_adapter: base
  required_capabilities: [action, evaluate_actions, batch_actions]
  args:
    action_adapter:
      type: rl.policy_adapter.action.GaussianActionAdapter
      args:
        initial_std: 0.1
        learn_std: true
buffer:
  type: rl.buffer.ReplayBuffer
  args:
    capacity: 100000
    seed: 0
runner:
  updates_per_iteration: 100
  warmup_steps: 1
