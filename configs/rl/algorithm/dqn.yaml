version: 1
type: rl.algorithm.DQNAlgorithm
args:
  gamma: 0.98
  reward_key: train/total
  double_q: true
  huber_loss: true
  target_update_interval: 200
  target_tau: 1.0
policy_adapter:
  required_capabilities: [action, dqn, target_update]
  args:
    epsilon_start: 0.08
    epsilon_end: 0.01
    epsilon_decay_steps: 30000
    seed: 0
buffer:
  type: rl.buffer.ReplayBuffer
  args:
    capacity: 100000
    seed: 0
runner:
  collect_episodes: 1
  updates_per_iteration: 10
  warmup_steps: 2000
