type: policy.florence2_oft
name: florence2_oft
args:
  # VLM Model Configuration
  # Supported models:
  #   - microsoft/Florence-2-base
  #   - microsoft/Florence-2-large
  vlm_model_name_or_path: microsoft/Florence-2-large
  
  # Policy Dimensions
  action_dim: 7
  state_dim: 7
  chunk_size: 16
  
  # Action Head Configuration
  action_hidden_dim: null  # Auto-set from VLM projection_dim
  action_head_hidden_mult: 2  # Hidden dim multiplier
  action_head_num_blocks: 2  # Number of MLP ResNet blocks
  
  # Pooling Strategy
  use_pooled_output: true  # Use mean pooling of encoder output
  
  # Task Prompt (for Florence2 format)
  task_prompt: "Locate the objects with category name in the image."
  
  # LoRA Configuration
  lora_enable: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  lora_bias: none
  lora_module: vision,encoder  # Modules to apply LoRA: vision, encoder
  
  # Training Configuration
  bits: 16
  bf16: false
  fp16: true  # Florence2 uses fp16 by default
  gradient_checkpointing: true
  freeze_backbone: false
  freeze_vision_tower: false

# Model Class Configuration
config_class: Florence2OFTConfig
model_class: Florence2OFTForPolicy

# Data Processing
data_processor: get_data_processor
data_collator: get_data_collator

# Trainer
trainer_class: Trainer

