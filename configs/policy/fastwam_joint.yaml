type: policy.fastwam
name: fastwam_joint
config_class: FastWAMPolicyConfig
model_class: FastWAMPolicy
args:
  # --- Attention mode ---
  # "joint": action attends to all video tokens (fastwam_joint.py); requires action_conditioned: false
  attention_mode: joint

  # --- WAN backbone (auto-downloaded on first use) ---
  model_id: Wan-AI/Wan2.2-TI2V-5B
  tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
  tokenizer_max_len: 128
  load_text_encoder: true           # required to encode raw_lang prompts
  redirect_common_files: true
  download_source: huggingface      # "huggingface" or "modelscope"

  # --- Proprio ---
  proprio_dim: null                 # set to state_dim if using proprio

  # --- Inference I/O (must match training task when loading a checkpoint without full task merge) ---
  # Eval with ``-t <task>`` normally fills these via ConfigLoader; set here for checkpoint-only deploy.
  action_dim: 14
  state_dim: 14
  chunk_size: 16
  image_size: [224, 224]
  num_views: 1
  # horizon: 17   # video / WM: set to match training temporal length (default in code is 1)

  # --- MoT / DiT checkpoints ---
  mot_checkpoint_mixed_attn: true
  action_dit_pretrained_path: null  # path to preprocessed ActionDiT backbone
  skip_dit_load_from_pretrain: false
  # inference_mode: set True only by load_model when eval/deploy (skip ActionDiT pretrain load)

  # --- Video DiT config ---
  video_dit_config:
    has_image_input: false
    patch_size: [1, 2, 2]
    in_dim: 48
    hidden_dim: 3072
    ffn_dim: 14336
    freq_dim: 256
    text_dim: 4096
    out_dim: 48
    num_heads: 24
    attn_head_dim: 128
    num_layers: 30
    eps: 1.0e-06
    seperated_timestep: true
    require_clip_embedding: false
    require_vae_embedding: false
    fuse_vae_embedding_in_latents: true
    use_gradient_checkpointing: true
    video_attention_mask_mode: first_frame_causal
    action_conditioned: false       # required false for joint (FastWAMJoint)
    # action_dim: auto-set from task config

  # --- Action DiT config ---
  action_dit_config:
    # action_dim: auto-set from task config
    hidden_dim: 1024
    ffn_dim: 4096
    num_heads: 24
    attn_head_dim: 128
    num_layers: 30
    text_dim: 4096
    freq_dim: 256
    eps: 1.0e-06
    use_gradient_checkpointing: true

  # --- Schedulers ---
  video_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000

  action_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000

  # --- Loss ---
  loss:
    lambda_video: 1.0
    lambda_action: 1.0

  # --- Inference settings ---
  generate_video: false             # set true to also generate video during inference
  num_video_frames: 17              # required for joint infer_joint / infer_action
  num_inference_steps: 20
  sigma_shift: null
  seed: null

data_processor: get_data_processor
data_collator: get_data_collator
trainer_class: Trainer
