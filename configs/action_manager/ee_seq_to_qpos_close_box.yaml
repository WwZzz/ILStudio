# close_box EE eval: longer sequence IK (narrow workspace / lid closure).
type: deploy.action_manager.ee_seq_to_qpos.EESequenceToQposManager
name: ee_seq_to_qpos_close_box
args:
  robot_shm_name: alicia_d
  polish: true
  ik_eps: 0.03
  ik_max_iter: 200
  ik_rotation_weight: 0.1
  interp_factor: 1

  max_ik_step_deg: 10.0
  max_q0_delta_deg: 25.0
  max_chunk_dq_deg: 15.0
  # close_box often lands ~0.15–0.22 FK err before polish; allow slightly more headroom.
  max_fk_err: 0.25
  max_ik_fails: 8
  clamp_traj: true
