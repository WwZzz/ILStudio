# close_box EE eval + async prefetch + longer sequence IK.
type: deploy.action_manager.ee_seq_to_qpos.EESequenceToQposAsyncManager
name: ee_seq_to_qpos_async_close_box
args:
  robot_shm_name: alicia_d
  chunk_ratio: 0.5

  chunk_hz: 30
  playback_hz: 30
  stitch_steps: 4
  hold_on_underrun: true

  polish: true
  ik_eps: 0.03
  ik_max_iter: 200
  ik_rotation_weight: 0.1
  interp_factor: 1

  max_ik_step_deg: 10.0
  max_q0_delta_deg: 25.0
  max_chunk_dq_deg: 15.0
  max_fk_err: 0.25
  max_ik_fails: 8
  clamp_traj: true
