# Keyboard Teleoperator for 6DOF + Gripper Control
#
# Uses a GUI window to capture keyboard events (works in subprocess)
# Outputs 7D delta action: [dx, dy, dz, d_roll, d_pitch, d_yaw, d_gripper]
#
# Default Key Mappings:
#   Translation:
#     W/S : Forward/Backward (X)
#     A/D : Left/Right (Y)
#     R/F : Up/Down (Z)
#
#   Rotation:
#     Q/E : Roll +/-
#     T/G : Pitch +/-
#     Z/C : Yaw +/-
#
#   Gripper:
#     V   : Open
#     B   : Close
#
#   Reset:
#     0   : Stop all motion
#
# Note: You must click on the GUI window to focus it before keyboard input works.

type: deploy.teleoperator.keyboard_6dof.Keyboard6DOF
name: keyboard_6dof
args:
  name: keyboard_6dof
  max_size_mb: 1
  fps: 50.0
  trans_scale: 1.0    # Scale factor for translation deltas (X, Y, Z)
  rot_scale: 1.0      # Scale factor for rotation deltas (Roll, Pitch, Yaw)
  gripper_scale: 1.0  # Scale factor for gripper delta
  debug: false
  
  # Optional: Override default key mappings
  # key_mappings:
  #   - {name: "X (forward/back)", key_positive: "w", key_negative: "s", scale: 1.0}
  #   - {name: "Y (left/right)", key_positive: "a", key_negative: "d", scale: 1.0}
  #   - {name: "Z (up/down)", key_positive: "r", key_negative: "f", scale: 1.0}
  #   - {name: "Roll", key_positive: "q", key_negative: "e", scale: 1.0}
  #   - {name: "Pitch", key_positive: "t", key_negative: "g", scale: 1.0}
  #   - {name: "Yaw", key_positive: "z", key_negative: "c", scale: 1.0}
  #   - {name: "Gripper", key_positive: "v", key_negative: "b", scale: 1.0}
