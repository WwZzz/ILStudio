# Slider Teleop for Bessica-D dual-arm — delta EE mode (14D)
#
# Action layout: [R_dx, R_dy, R_dz, R_droll, R_dpitch, R_dyaw, R_gripper,
#                 L_dx, L_dy, L_dz, L_droll, L_dpitch, L_dyaw, L_gripper]
#
# Gripper: positive = open, 0 = no change, negative = close.
# Slider at 0 = no motion; drag to move.
#
# Use with: configs/robot/bessica_sim.yaml (delta_ee mode)
# Run:
#   python collect_data.py -r configs/robot/bessica_sim.yaml -t configs/teleop/slider_bessica_ee.yaml --visualize

type: deploy.teleoperator.tk_slider.SliderTeleop
name: slider_bessica_ee
args:
  name: slider_bessica_ee
  max_size_mb: 1
  fps: 50.0
  action_dim: 14
  slider_ranges:
    # Right arm (7D)
    - [-1.0, 1.0]    # R dx
    - [-1.0, 1.0]    # R dy
    - [-1.0, 1.0]    # R dz
    - [-1.0, 1.0]    # R droll
    - [-1.0, 1.0]    # R dpitch
    - [-1.0, 1.0]    # R dyaw
    - [-1.0, 1.0]    # R gripper (pos=open)
    # Left arm (7D)
    - [-1.0, 1.0]    # L dx
    - [-1.0, 1.0]    # L dy
    - [-1.0, 1.0]    # L dz
    - [-1.0, 1.0]    # L droll
    - [-1.0, 1.0]    # L dpitch
    - [-1.0, 1.0]    # L dyaw
    - [-1.0, 1.0]    # L gripper (pos=open)
  slider_labels:
    - "R-X (fwd/back)"
    - "R-Y (left/right)"
    - "R-Z (up/down)"
    - "R-Roll"
    - "R-Pitch"
    - "R-Yaw"
    - "R-Gripper"
    - "L-X (fwd/back)"
    - "L-Y (left/right)"
    - "L-Z (up/down)"
    - "L-Roll"
    - "L-Pitch"
    - "L-Yaw"
    - "L-Gripper"
