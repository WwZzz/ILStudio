datasets:
- type: data_utils.datasets.WrappedLerobotDataset
  name: lerobot_bridge_v2
  args:
    dataset_path_list:
    - BrunoM42/fractal20220817_data_lerobot
    chunk_size: 1
    ctrl_space: ee
    ctrl_type: abs
    episode_filter:
      task_index: [0]
      # task: "pick rxbar chocolate from bottom drawer and place on counter"
meta:
  action_dim: 7
  state_dim: 8
  image_size:
  - 256
  - 256
  action_normalize: zscore
  state_normalize: zscore
