# RLBench ReachTarget Task Configuration for Training
#
# Dataset generated by:
#   python benchmark/rlbench/generate_dataset.py \
#       --env_config configs/env/rlbench_reach.yaml \
#       --output_dir data/rlbench/reach_target \
#       --num_demos 50
#
# Training:
#   python train.py --policy act --task rlbench_reach --output_dir ckpt/act_rlbench_reach
#
# Evaluation:
#   python eval_sim.py -e rlbench_reach -m ckpt/act_rlbench_reach --batch_size 0

datasets:
  - type: data_utils.datasets.rlbench_dataset.RLBenchDataset
    name: rlbench_reach_target
    args:
      dataset_path_list: 
        - data/rlbench/reach_target  # Directory containing HDF5 files
      chunk_size: 16
      ctrl_space: joint  # 'ee', 'joint', or 'joint_vel'
      ctrl_type: abs     # 'abs' or 'delta'
      camera_names:
        - front
        - wrist
      image_size:
        - 128
        - 128

meta:
  action_dim: 8   # 7 joints/pose + 1 gripper
  state_dim: 8    # 7 joints/pose + 1 gripper
  action_normalize: zscore
  state_normalize: zscore

