# sim_transfer_cube_scripted – Video (world-model) variant for FastWAM
#
# Robot:   Bimanual ALOHA (2x Viper-X 300 6DOF)
# Control: joint (14-dim absolute joint positions)
# State:   14-dim  [qpos_left(7), qpos_right(7)]
# Action:  14-dim  [action_left(7), action_right(7)]
# Camera:  top
#
# Video constraints for FastWAM:
#   T % 4 == 1  →  horizon=17
#   action_horizon % (T-1) == 0  →  chunk_size must be multiple of 16

datasets:
  - type: data_utils.datasets.wm.AlohaSimVideoDataset
    name: sim_transfer_cube_scripted_wm
    args:
      dataset_path_list:
        - data/sim_transfer_cube_scripted
      camera_names:
        - top
      chunk_size: 16
      image_size:
        - 256
        - 256
      ctrl_space: joint
      ctrl_type: abs
      horizon: 17
      frame_skip: 1
      input_steps: 1

meta:
  action_dim: 14
  state_dim: 14
  action_normalize: zscore
  state_normalize: zscore
