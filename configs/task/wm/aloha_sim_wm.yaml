# ALOHA Sim Video Dataset task config
#
# Uses AlohaSimVideoDataset which batch-reads T consecutive frames from
# ALOHA simulation HDF5 files with a single fancy-index call per camera.
#
# Robot:   Bimanual (2x Viper-X 300 6DOF)
# Control: joint (14-dim absolute joint positions)
# State:   14-dim  [qpos_left(7), qpos_right(7)]
# Action:  14-dim  [action_left(7), action_right(7)]
# Cameras: top + optional left_wrist, right_wrist

datasets:
  - type: data_utils.datasets.wm.AlohaSimVideoDataset
    name: aloha_sim_wm
    args:
      dataset_path_list: []    # auto-downloaded if empty; or set via CLI
      camera_names:
        - top
      chunk_size: 24
      image_size:
        - 256
        - 256
      ctrl_space: joint
      ctrl_type: abs
      horizon: 16
      frame_skip: 1
      input_steps: 1

meta:
  action_dim: 14
  state_dim: 14
  action_normalize: zscore
  state_normalize: zscore
