# Dataset configuration (for training/offline RL)
datasets:
  - type: data_utils.datasets.robotwin_dataset.RoboTwinDataset
    name: robotwin_diverse_bottle_clean_agilex
    args:
      # Data source - choose ONE:
      # Option 1: Download from Hugging Face
      # dataset_name: adjust_bottle/aloha-agilex_clean_50
      
      # Option 2: Use local path (directory or .zip)
      dataset_path: /home/noematrix/.cache/huggingface/datasets/aloha-agilex_clean_50

      # Image settings
      image_size: [480, 640]  # [H, W]
      chunk_size: 16          # Action chunk length for policies like Diffusion Policy

      # Camera selection
      camera_names:
        - head_camera      # Front/overhead camera
        - left_camera      # Left wrist camera
        - right_camera     # Right wrist camera
        # - front_camera   # Alternative camera name (if available in data)

      # Control settings
      ctrl_space: qpos       # Joint position control
      ctrl_type: abs         # Absolute control

      # Data loading
      preload_data: false    # Set to true to load all data into RAM

# Metadata
meta:
  # Dimensions are auto-detected from HDF5 structure
  # For aloha-agilex: 6 joints per arm + 1 gripper = 14 total
  action_dim: 14
  state_dim: 14
  # Normalization
  action_normalize: zscore
  state_normalize: zscore



