datasets:
- type: data_utils.datasets.WrappedLerobotDataset
  name: lerobot_libero
  args:
    dataset_path_list:
    - HuggingFaceVLA/libero
    chunk_size: 50
    ctrl_space: ee
    ctrl_type: delta
    camera_names: observation.images.image
meta:
  action_dim: 7
  state_dim: 8
  action_normalize: zscore
  state_normalize: zscore
