# RoboTwin Pick Diverse Bottles Task with Franka Panda (Single-Arm Robot)
#
# This config demonstrates using a single-arm robot with wrist camera
#
# IMPORTANT: RoboTwin does NOT support parallel execution
# Always use --batch_size 0 (sequential mode)
#
# Usage:
#   benchmark/robotwin/.venv/bin/python eval_sim.py \
#     -e robotwin_pick_bottles_franka -m <model> --batch_size 0

type: benchmark.robotwin.RoboTwinEnv
name: robotwin_pick_diverse_bottles_franka
args:
  task: pick_diverse_bottles  # Task class name (matches Python file)
  task_config: demo_clean     # 'demo_clean' or 'demo_randomized'
  max_timesteps: 400         # Maximum steps per episode
  ctrl_space: qpos            # 'qpos' or 'ee'
  ctrl_type: abs              # Only 'abs' supported by RoboTwin
  seed: 0
  
  # Camera Configuration - Single-arm robot
  # Note: Single-arm robots use 'left_camera' for their wrist camera
  camera_names:
    - head_camera             # Overhead view (required)
    - left_camera             # Wrist-mounted camera (RoboTwin uses left_camera for single-arm)
  image_size: [480, 640]      # [H, W] for all cameras
  
  # Robot Embodiment - Single-arm Franka Panda
  embodiment: franka-panda
  
  # Motion Planner Configuration
  use_planner: false          # false: Fast inference (recommended for policy eval)
                              # true: Use Curobo + TOPP for smooth trajectories and collision avoidance
  
  # robotwin_root: /path/to/RoboTwin  # Optional: custom RoboTwin root path (default: benchmark/robotwin/RoboTwin)

