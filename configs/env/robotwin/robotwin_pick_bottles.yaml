# RoboTwin Pick Diverse Bottles Task
#
# IMPORTANT: RoboTwin does NOT support parallel execution
# Always use --batch_size 0 (sequential mode)
#
# Usage:
#   benchmark/robotwin/.venv/bin/python eval_sim.py \
#     -e robotwin_pick_bottles -m <model> --batch_size 0

type: benchmark.robotwin.RoboTwinEnv
name: robotwin_pick_diverse_bottles
args:
  task: pick_diverse_bottles  # Task class name (matches Python file)
  task_config: demo_clean     # 'demo_clean' or 'demo_randomized'
  max_timesteps: 400         # Maximum steps per episode (RoboTwin default for this task)
  ctrl_space: ee            # 'qpos' or 'ee'
  ctrl_type: abs              # Only 'abs' supported by RoboTwin
  seed: 0
  
  # Camera Configuration
  # Use RoboTwin's original camera names directly:
  #   - head_camera: Fixed overhead camera
  #   - left_camera: Left arm wrist camera
  #   - right_camera: Right arm wrist camera
  camera_names:
    - head_camera             # Fixed overhead camera (required)
    # - left_camera           # Uncomment to enable left arm wrist camera
    # - right_camera          # Uncomment to enable right arm wrist camera
  image_size: [480, 640]      # [H, W] for cameras
  
  # Robot Embodiment Configuration (optional)
  # If not specified, uses embodiment from task_config YAML (default: aloha-agilex)
  # Available options: aloha-agilex, piper, franka-panda, ARX-X5, ur5-wsg
  # embodiment: aloha-agilex  # Single robot for dual-arm setup
  # embodiment: [ur5-wsg, franka-panda, 0.5]  # Heterogeneous dual-arm (left, right, distance)
  
  # Motion Planner Configuration
  use_planner: false          # false: Fast inference (recommended for policy eval)
                              # true: Use Curobo + TOPP for smooth trajectories and collision avoidance
  
  # robotwin_root: /path/to/RoboTwin  # Optional: custom RoboTwin root path (default: benchmark/robotwin/RoboTwin)

