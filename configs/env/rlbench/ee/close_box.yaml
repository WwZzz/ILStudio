# RLBench CloseBox Task Configuration
#
# IMPORTANT: RLBench does NOT support parallel execution (SubprocVectorEnv)
# because CoppeliaSim cannot be safely run in multiple processes.
#
# Usage:
#   python eval_sim.py -e rlbench.ee.close_box -m <model> --batch_size 0
#
# The --batch_size 0 flag forces sequential execution mode.

type: benchmark.rlbench.RLBenchEnv
name: rlbench_close_box
args:
  task: CloseBox
  max_timesteps: 450  # ~1.3x the longest training demonstration (343 frames)
  ctrl_space: ee  # 'joint' or 'ee'
  ctrl_type: abs     # 'abs' or 'delta'
  ee_exec: ik  # Match the controller used to validate this checkpoint/task.
  camera_names:
    - overhead
    - wrist
  image_size: [256, 256]
  headless: true

