# Alicia-D Robot Configuration - Relative EE (Anchor) Control Mode
# 相对末端位姿控制模式，VR解冻后锁定锚点，后续动作相对锚点应用
# Optimized for VR teleoperation with fast Pinocchio IK (~0.3ms)

type: deploy.robot.alicia_d.AliciaD
args:
  name: alicia_d
  fps: 200.0
  control_mode: rel_ee  # Relative EE control with anchor mechanism
  port: /dev/ttyACM0
  # Speed settings
  speed_deg_s: 400.0      # Higher speed for responsive control
  gripper_speed_deg_s: 483.4
  
  # IK settings (optimized for real-time VR teleoperation)
  ik_eps: 0.001          # 1mm tolerance
  ik_max_iter: 20        # ~0.3ms per solve
  ik_dt: 1.0             # Large step for fast convergence
  ik_rotation_weight: 0.3 
  
  # Relative EE scaling (tune based on your teleop device)
  position_scale: 1.0    # meters -> meters
  rotation_scale: 1.0    # radians -> radians
  gripper_scale: 1.0    # Inverted: AliciaD gripper increases to close, so negate input
  

  # Smoothing: exponential low-pass filter on joint trajectory
  smoothing_tau: 0.04  
  
  # Safety settings
  max_joint_delta_deg: 270.0  # Max allowed joint change per action (degrees)
  
  debug: false
