# Alicia-D — 相对末端 (rel_ee) + Piper 风格全局优化 IK
# VR 解冻后锚点锁定，后续动作相对锚点；无 casadi 时自动 scipy。

- type: deploy.robot.alicia_d.AliciaD
  name: alicia_d_rel_ee
  args:
    name: alicia_d
    fps: 200.0
    control_mode: rel_ee
    port: /dev/ttyACM0

    speed_deg_s: 400.0
    gripper_speed_deg_s: 483.4

    ik_end_frame: link6
    ik_ee_offset_xyz: [0.0, 0.0, 0.0]
    ik_ee_offset_rpy: [0.0, 0.0, 0.0]

    ik_eps: 0.01
    ik_max_iter: 200
    ik_rotation_weight: 0.1

    position_scale: 1.0
    rotation_scale: 1.0
    gripper_scale: 1.0

    max_joint_delta_deg: 30.0
    debug: false
    # 夹爪调试：true 时打 [GripperTrace:robot]，可与 teleop 的 gripper_trace 对照
    gripper_trace: false


- type: deploy.sensor.camera.opencv_camera.OpenCVCamera
  name: wrist_camera
  args:
    name: wrist_camera
    index_or_path: /dev/video4
    width: 640
    height: 480
    max_size_mb: 10
    fps: 30
    fourcc: MJPG
    bgr_to_rgb: true

- type: deploy.sensor.camera.opencv_camera.OpenCVCamera
  name: side_camera
  args:
    name: side_camera
    index_or_path: /dev/video2
    width: 640
    height: 480
    fps: 30
    max_size_mb: 10
    fourcc: MJPG
    bgr_to_rgb: true
