name: Package validation
on:
  pull_request:
  push:
    branches: [main, codex/pypi-release, codex/environment-installers]
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install built wheel without ML dependencies
        shell: bash
        run: |
          python -m pip install dist/*.whl
      - run: python .github/check_package.py
