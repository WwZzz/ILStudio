[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vlastudio"
version = "0.2.0.dev0"
description = "Extensible robotics policy training and deployment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6,<7", "platformdirs>=4,<5", "filelock>=3.16,<4", "loguru>=0.7,<1", "uv>=0.8,<1"]

[project.scripts]
vlastudio = "vlastudio.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "hatchling", "tomli>=2; python_version<'3.11'"]
# Layer 1: formats, image/video IO and transforms shared by dataset adapters.
data = ["numpy==1.26.4", "h5py==3.12.1", "pillow==11.3.0", "opencv-python==4.9.0.80", "imageio==2.37.0", "imageio-ffmpeg==0.6.0", "scipy==1.14.1", "tqdm>=4.67,<5"]
# Layer 2: the conservative default used by the original VLAStudio base runtime.
torch = ["torch==2.4.0", "torchvision==0.19.0", "torchaudio==2.4.0", "torchdata==0.9.0"]
base = ["numpy==1.26.4", "h5py==3.12.1", "pillow==11.3.0", "opencv-python==4.9.0.80", "imageio==2.37.0", "imageio-ffmpeg==0.6.0", "scipy==1.14.1", "tqdm>=4.67,<5", "torch==2.4.0", "torchvision==0.19.0", "torchaudio==2.4.0", "torchdata==0.9.0"]
# Layer 3: policy families. Each extra is independently installable and includes
# the shared data/PyTorch base so users can copy one command from an error.
act = ["torch==2.4.0", "torchvision==0.19.0", "torchaudio==2.4.0", "torchdata==0.9.0", "numpy==1.26.4", "h5py==3.12.1", "pillow==11.3.0", "opencv-python==4.9.0.80", "imageio==2.37.0", "imageio-ffmpeg==0.6.0", "scipy==1.14.1", "tqdm>=4.67,<5", "transformers==4.45.2", "accelerate==1.0.1", "einops==0.8.1", "timm==1.0.15", "matplotlib==3.9.4", "websockets==13.1", "psutil==6.1.1", "tensorboardX==2.6.4", "protobuf==5.29.6"]
diffusion = ["torch==2.4.0", "torchvision==0.19.0", "torchaudio==2.4.0", "numpy==1.26.4", "h5py==3.12.1", "pillow==11.3.0", "opencv-python==4.9.0.80", "scipy==1.14.1", "transformers==4.45.2", "accelerate==1.0.1", "diffusers==0.30.3", "einops==0.8.1", "timm==1.0.15"]
fastwam = ["torch==2.7.1", "torchvision==0.22.1", "numpy==1.26.4", "h5py==3.12.1", "pillow==12.0.0", "opencv-python==4.9.0.80", "imageio==2.37.0", "imageio-ffmpeg==0.6.0", "scipy==1.14.1", "transformers==4.49.0", "accelerate==1.12.0", "hydra-core==1.3.2", "omegaconf==2.3.0", "huggingface-hub==0.29.2", "safetensors==0.5.3", "einops==0.8.1", "av==15.1.0", "ftfy", "sentencepiece", "timm", "packaging", "boto3==1.35.99", "termcolor==2.5.0", "rich==14.2.0"]
smolvla = ["torch==2.7.1", "torchvision==0.22.1", "torchaudio==2.7.1", "torchdata==0.9.0", "numpy==1.26.4", "h5py==3.12.1", "pillow==11.3.0", "opencv-python==4.9.0.80", "transformers==4.51.3", "accelerate>=1,<2", "lerobot[smolvla]==0.3.3", "einops", "timm>=1,<2", "tensorboardX==2.6.4"]
openpi = ["torch>=2.4", "torchvision>=0.19", "numpy==1.26.4", "h5py==3.12.1", "pillow>=11", "jax==0.4.35", "flax>=0.10,<0.11", "transformers>=4.45,<5", "einops", "safetensors"]
qwen = ["torch>=2.4", "torchvision>=0.19", "numpy==1.26.4", "h5py==3.12.1", "pillow>=11", "transformers==4.52.4", "accelerate", "peft==0.17.1", "diffusers==0.35.1", "qwen-vl-utils", "einops", "timm>=0.9.10"]
openvla = ["torch>=2.4", "torchvision>=0.19", "numpy==1.26.4", "h5py==3.12.1", "pillow>=11", "transformers>=4.45,<5", "accelerate", "peft>=0.10", "bitsandbytes>=0.43", "timm>=0.9", "safetensors"]
xvla = ["torch>=2.4", "torchvision>=0.19", "numpy==1.26.4", "h5py==3.12.1", "pillow>=11", "transformers>=4.45,<5", "accelerate", "safetensors", "huggingface-hub", "draccus"]
roboflamingo = ["torch>=2.4", "torchvision>=0.19", "numpy==1.26.4", "h5py==3.12.1", "pillow>=11", "transformers>=4.33,<5", "accelerate>=0.26", "einops>=0.6.1", "einops-exts>=0.0.4", "open-clip-torch>=2.20", "open-flamingo", "datasets<=4.4.2"]
octo = ["torch>=2.2", "torchvision>=0.17", "numpy==1.24.3; python_version<'3.12'", "numpy>=1.26,<2; python_version>='3.12'", "jax==0.4.20", "jaxlib==0.4.20", "flax==0.7.5", "tensorflow==2.15.0", "tensorflow-datasets==4.9.2", "tensorflow-probability==0.23.0", "tensorflow-hub>=0.14.0", "tensorflow-text>=2.13.0", "chex==0.1.85", "optax==0.1.5", "distrax==0.1.5", "ml-collections>=0.1.0", "einops>=0.6.1"]
groot = ["torch>=2.4", "torchvision>=0.19", "numpy==1.26.4", "h5py>=3.10", "pillow>=11", "transformers>=4.45,<5", "safetensors>=0.4", "einops", "scipy", "dm-tree", "deepspeed>=0.14", "huggingface-hub>=0.34"]
aloha = ["dm-control==1.0.34", "mujoco==3.3.6"]
remote-eval = ["torch==2.4.0", "numpy==1.26.4", "pillow==11.3.0", "opencv-python==4.9.0.80", "imageio==2.37.0", "imageio-ffmpeg==0.6.0", "tqdm==4.67.1", "requests==2.32.5", "psutil==6.1.1"]
serve-http = ["fastapi==0.115.6", "uvicorn==0.34.0"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# Policy stacks are environment alternatives, not a request to solve every model
# into one interpreter. This lets uv lock mutually incompatible pins separately.
conflicts = [
  [{ extra = "act" }, { extra = "diffusion" }, { extra = "fastwam" }, { extra = "smolvla" }, { extra = "openpi" }, { extra = "qwen" }, { extra = "openvla" }, { extra = "xvla" }, { extra = "roboflamingo" }, { extra = "octo" }, { extra = "groot" }],
  [{ extra = "fastwam" }, { extra = "torch" }],
  [{ extra = "fastwam" }, { extra = "base" }],
  [{ extra = "fastwam" }, { extra = "data" }],
  [{ extra = "fastwam" }, { extra = "remote-eval" }],
  [{ extra = "smolvla" }, { extra = "torch" }],
  [{ extra = "smolvla" }, { extra = "base" }],
  [{ extra = "smolvla" }, { extra = "remote-eval" }],
  [{ extra = "octo" }, { extra = "data" }],
  [{ extra = "octo" }, { extra = "base" }],
  [{ extra = "octo" }, { extra = "remote-eval" }],
]

[tool.hatch.build.targets.wheel]
packages = ["src/vlastudio"]
exclude = ["**/.venv/**", "**/__pycache__/**", "**/.git/**", "**/.ipynb_checkpoints/**"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/README.legacy.md", "/LICENSE", "/pyproject.toml", "/examples", "/docs/package_runtime.md", "/docs/environments.md", "/docs/installation.md", "/docs/package_validation.md", "/docs/gpu_validation.json", "/requirements-legacy.txt", "/uv.lock"]
exclude = ["**/.venv/**", "**/__pycache__/**", "**/.git/**"]
