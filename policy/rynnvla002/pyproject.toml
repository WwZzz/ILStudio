[project]
name = "ilstd-rynnvla002"
version = "0.1.0"
description = "RynnVLA-002 autoregressive VLA + World Model policy for ILStudio"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.2",
    "transformers>=4.43",
    "einops",
    "safetensors",
    "huggingface_hub",
    "sentencepiece",
    "fairscale",
    "flash-attn",
    "timm",
    "loguru",
    "tianshou==0.2.0",
]

[tool.uv]
default-groups = []
