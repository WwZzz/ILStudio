# ACT training on the complete 50-episode ALOHA transfer-cube dataset.
preload_data: false
learning_rate: 0.0001
weight_decay: 0.0
lr_scheduler_type: constant
optim: adamw_torch
adam_beta1: 0.95
adam_beta2: 0.999
adam_epsilon: 1.0e-8
logging_strategy: steps
logging_steps: 10
report_to: tensorboard
save_strategy: steps
save_steps: 2000
save_total_limit: 3
dataloader_num_workers: 8
dataloader_pin_memory: true
remove_unused_columns: false
do_eval: false
seed: 0
max_steps: 10000
per_device_train_batch_size: 32
per_device_eval_batch_size: 32
resume_from_checkpoint: true
