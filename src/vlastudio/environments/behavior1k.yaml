python: '3.10'
requires_python: '>=3.10,<3.11'
platforms: [linux]
min_glibc: '2.34'
description: OmniGibson 3.7.2 with Isaac Sim 4.5 and optional BEHAVIOR assets.
installers: [behavior1k]
checks: [behavior1k]
requirements:
- torch==2.6.0
- torchvision==0.21.0
- numpy==1.26.4
- pillow~=11.0.0
- websockets>=15.0.1
- huggingface-hub[cli]>=0.34.4,<1
- opencv-python==4.10.0.84
- omnigibson @ https://github.com/StanfordVL/BEHAVIOR-1K/archive/88454bd04f75dc57c00ab1f1a00bcde1ff505950.tar.gz#subdirectory=OmniGibson
- bddl @ https://github.com/StanfordVL/BEHAVIOR-1K/archive/88454bd04f75dc57c00ab1f1a00bcde1ff505950.tar.gz#subdirectory=bddl3
notes:
- Assets require --assets and explicit behavior-dataset license acceptance.
- NVIDIA GPU, compatible graphics driver and host GL/EGL libraries are required.
