name: r2r_vlnce
datasets:
- name: r2r_vlnce
  type: vlastudio.data_utils.datasets.VLNCEDataset
  args:
    max_trajectories: 256
    download: true
    scenes_dir: data/scene_datasets
    sample_mode: episode
cache:
  level: processor
  num_workers: 0
meta:
  action_dim: 1
  state_dim: 0
  chunk_size: 1
  action_normalize: identity
  state_normalize: identity
