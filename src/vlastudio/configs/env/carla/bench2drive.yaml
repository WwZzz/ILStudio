type: vlastudio.benchmark.carla.create_env
name: carla_bench2drive
task: bench2drive
ctrl_space: vehicle
ctrl_type: control
action_order: [steer, throttle, brake, reverse]
remove_map_parked_vehicles: true  # Bench2Drive respawns parking from its own catalog.
max_timesteps: 200010  # Allow the official 10000-second scenario timeout at 20 Hz.
reuse_env: true
record_video: false
gpu: 0
seed: 0
startup_timeout: 180.0
step_timeout: 600.0
